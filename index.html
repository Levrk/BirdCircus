<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
 
    <header>
        <h1>Stuff</h1>
        <div>
            <button id="type-filter" type="button" aria-label="Filter by type: all">[ TYPE: ALL ]</button>
            <select id="sort-select">
                <option value="date-desc">DATE (NEWEST)</option>
                <option value="date-asc">DATE (OLDEST)</option>
                <option value="rating-desc">RATING (HIGH)</option>
                <option value="rating-asc">RATING (LOW)</option>
            </select>
        </div>
    </header>

    <div class="layout">
        <div class="feed-section">
            <main id="feed"></main>
            <nav id="pagination" aria-label="Review pages"></nav>
        </div>
        <aside id="sidebar"></aside>
    </div>

    <div id="modal" class="hidden">
        <div class="modal-box">
            <button id="modal-close">[X]</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
