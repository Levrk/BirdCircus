<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bird Circus</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
 
    <header>
        <div class="music-player">
            <button id="play-toggle" type="button" aria-label="Play">[ PLAY ]</button>
            <button id="skip-button" type="button">[ SKIP ]</button>
            <h1 id="current-track" aria-live="polite"></h1>
        </div>
        <div class="review-controls">
            <audio id="audio-player" preload="metadata"></audio>
            <button id="type-filter" type="button" aria-label="Filter by type: all">[ TYPE: ALL ]</button>
            <select id="sort-select">
                <option value="date-desc">DATE (NEWEST)</option>
                <option value="date-asc">DATE (OLDEST)</option>
                <option value="rating-desc">RATING (HIGH)</option>
                <option value="rating-asc">RATING (LOW)</option>
            </select>
        </div>
    </header>

    <div class="layout">
        <div class="feed-section">
            <main id="feed"></main>
            <nav id="pagination" aria-label="Review pages"></nav>
        </div>
        <aside id="sidebar"></aside>
    </div>

    <div id="modal" class="hidden">
        <div class="modal-box">
            <button id="modal-close">[X]</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <div id="snippet-ticker" role="status" aria-live="polite">
        <div class="snippet-ticker-track">
            <span></span><span aria-hidden="true"></span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
